# website-admin 静态服务：仅托管 SPA 产物，/api/v1 由外层 Caddy 反代到后端。
# SPA 前端路由（react-router）需要 history fallback：未命中的路径回落到 index.html。
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # 带内容哈希的静态资源可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回落
    location / {
        try_files $uri $uri/ /index.html;
    }
}
