<svg viewBox="200 200 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 微域生光 — 浅底三原色版 / Web (light backgrounds) -->
  <!-- 构成：描边菱形（留白内芯）+ 黄光域 + W 脉冲 + 共振弧。
       菱形不再是实心深色底块，只保留描边，重量卸掉、轮廓留下。 -->
  <!-- 三原色的岗位分工（依据 globals.css 中三支色的实测对比度）：
       蓝 #0f5fd8 5.9:1、红 #c8202c 5.6:1 在纸底上可写线；
       黄 #e8b21c 仅 1.9:1，写不了任何细线，因此它只以光域的形式铺面——
       这也是 globals.css 给黄定的岗位（光域 / 图标填充 / 色块）。
       脉冲第三段收成墨色：三段全彩会与黄光域抢，且墨色是这里唯一的中性锚点。 -->
  <defs>
    <radialGradient id="weiyu-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#e8b21c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8b21c" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <g transform="translate(400,400)">
    <!-- 内芯填纯白而非纸色：导航静止态是纸底、滚动后是半透明玻璃，
         纯白在两种底上都能把菱形内外拉开一档，纸色在静止态会与背景糊在一起 -->
    <rect x="-130" y="-130" width="260" height="260" rx="42" fill="#ffffff"
          stroke="#0e0e0e" stroke-width="9" transform="rotate(45)"/>
    <circle cx="0" cy="16" r="62" fill="url(#weiyu-glow)"/>
    <!-- 相邻段共用端点（±24,-9.6），圆头笔帽在同一坐标重叠，视觉上仍是一条连续折线 -->
    <g fill="none" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-70.4,-9.6 L-48,32 L-24,-9.6" stroke="#0f5fd8"/>
      <path d="M-24,-9.6 L0,32 L24,-9.6" stroke="#c8202c"/>
      <path d="M24,-9.6 L48,32 L70.4,-9.6" stroke="#0e0e0e"/>
    </g>
    <path d="M-57.6,44.8 Q0,64 57.6,44.8" fill="none" stroke="#0e0e0e" stroke-width="8.8" stroke-linecap="round"/>
  </g>
</svg>
