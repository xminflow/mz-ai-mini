    <rect x="118" y="324" width="3" height="12" rx="1.5" fill="#fb7185"/>
    <rect x="128" y="327" width="26" height="7" rx="3.5" fill="#fb7185" opacity="0.28"/>
    <rect x="196" y="327" width="170" height="7" rx="3.5" fill="#e6edf7" opacity="0.7"/>
    <rect x="392" y="327" width="72" height="7" rx="3.5" fill="#93a4bd" opacity="0.45"/>
    <rect x="520" y="327" width="48" height="7" rx="3.5" fill="#fbbf24" opacity="0.7"/>
  </g>
  <line x1="104" y1="347" x2="624" y2="347" stroke="#94a3b8" stroke-opacity="0.12"/>
  <g>
