  <rect x="478" y="252" width="30" height="6" rx="3" fill="#93a4bd" opacity="0.45"/>
  <rect x="522" y="252" width="30" height="6" rx="3" fill="#93a4bd" opacity="0.45"/>
  <rect x="566" y="252" width="30" height="6" rx="3" fill="#93a4bd" opacity="0.45"/>

