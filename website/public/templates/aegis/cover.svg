    <rect x="448" y="86" width="30" height="8" rx="4" fill="#fbbf24" opacity="0.9"/>
  </g>
  <g>
    <rect x="500" y="58" width="124" height="56" rx="8" fill="url(#glass)" stroke="#94a3b8" stroke-opacity="0.14"/>
    <rect x="512" y="70" width="38" height="6" rx="3" fill="#93a4bd" opacity="0.5"/>
    <rect x="512" y="84" width="56" height="14" rx="3" fill="#e6edf7" opacity="0.92"/>
