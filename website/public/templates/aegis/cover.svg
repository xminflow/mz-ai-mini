  <!-- 顶栏 -->
  <rect x="88" y="0" width="552" height="44" fill="#0a0f18" fill-opacity="0.6"/>
  <line x1="88" y1="44" x2="640" y2="44" stroke="#94a3b8" stroke-opacity="0.14"/>
  <rect x="104" y="13" width="96" height="9" rx="4.5" fill="#e6edf7" opacity="0.9"/>
  <rect x="104" y="28" width="140" height="6" rx="3" fill="#93a4bd" opacity="0.45"/>
