  <line x1="88" y1="0" x2="88" y2="400" stroke="#94a3b8" stroke-opacity="0.14"/>
  <rect x="12" y="14" width="16" height="16" rx="4" fill="#38bdf8"/>
  <rect x="34" y="19" width="30" height="7" rx="3.5" fill="#e6edf7" opacity="0.85"/>
  <rect x="8" y="52" width="72" height="20" rx="5" fill="#38bdf8" fill-opacity="0.16"/>
  <rect x="16" y="58" width="48" height="7" rx="3.5" fill="#38bdf8"/>
  <rect x="16" y="82" width="42" height="7" rx="3.5" fill="#93a4bd" opacity="0.5"/>
  <rect x="16" y="104" width="52" height="7" rx="3.5" fill="#93a4bd" opacity="0.5"/>
  <rect x="16" y="126" width="36" height="7" rx="3.5" fill="#93a4bd" opacity="0.5"/>
  <rect x="16" y="148" width="46" height="7" rx="3.5" fill="#93a4bd" opacity="0.5"/>
