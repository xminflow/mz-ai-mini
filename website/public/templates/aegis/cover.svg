  <rect x="105" y="289" width="518" height="24" rx="7" fill="#94a3b8" fill-opacity="0.05"/>
  <line x1="104" y1="313" x2="624" y2="313" stroke="#94a3b8" stroke-opacity="0.14"/>
  <rect x="118" y="298" width="34" height="6" rx="3" fill="#93a4bd" opacity="0.45"/>
  <rect x="196" y="298" width="52" height="6" rx="3" fill="#93a4bd" opacity="0.45"/>
  <rect x="392" y="298" width="40" height="6" rx="3" fill="#93a4bd" opacity="0.45"/>
  <rect x="520" y="298" width="34" height="6" rx="3" fill="#93a4bd" opacity="0.45"/>

