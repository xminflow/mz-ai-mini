  <line x1="116" y1="184" x2="432" y2="184" stroke="#fb7185" stroke-width="1" stroke-opacity="0.7"/>
  <circle cx="340" cy="166" r="4" fill="#fb7185" stroke="#0d121c" stroke-width="2"/>
  <line x1="116" y1="248" x2="432" y2="248" stroke="#94a3b8" stroke-opacity="0.16"/>
  <rect x="116" y="256" width="18" height="5" rx="2.5" fill="#93a4bd" opacity="0.4"/>
  <rect x="192" y="256" width="18" height="5" rx="2.5" fill="#93a4bd" opacity="0.4"/>
  <rect x="268" y="256" width="18" height="5" rx="2.5" fill="#93a4bd" opacity="0.4"/>
