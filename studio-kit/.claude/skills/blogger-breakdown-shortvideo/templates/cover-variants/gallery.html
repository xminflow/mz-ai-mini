<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cover Variants · 陈厂长 · 7 套候选</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #d4af37;
      --gold-soft: rgba(201,162,39,0.5);
      --bg: #060606;
    }
    html, body {
      background: var(--bg);
      color: #fff;
      font-family: 'Microsoft YaHei', 'PingFang SC', SimHei, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(6,6,6,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(201,162,39,0.18);
      padding: 12px 16px 12px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
    }
    .topbar h1 {
      font-size: 15px;
      color: var(--gold);
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .topbar .sub {
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      margin-top: 2px;
    }
    .topbar .actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .topbar button, .topbar .jump {
      background: rgba(201,162,39,0.12);
      color: var(--gold);
      border: 1px solid var(--gold-soft);
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 999px;
      font-family: inherit;
      letter-spacing: 0.04em;
      text-decoration: none;
      white-space: nowrap;
    }
    .topbar select {
      background: rgba(201,162,39,0.08);
      color: var(--gold);
      border: 1px solid var(--gold-soft);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 999px;
      font-family: inherit;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 18px 12px 40px;
    }

    .card {
      width: 100%;
      max-width: 540px; /* 大屏不要拉得太大 */
      margin: 0 auto;
      background: #0b0b0b;
      border: 1px solid rgba(201,162,39,0.22);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
    }

    /* 9:16 竖屏外框；iframe 内部跑 1080×1920，用 transform: scale 自适应到容器宽度 */
    .frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #080808;
    }
    .frame-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 1080px;
      height: 1920px;
      border: 0;
      transform-origin: top left;
      pointer-events: none;
    }
    /* 桌面屏 max-width=540px：scale = 540/1080 = 0.5。
       小屏会按实际宽度算，JS 在 onload 后赋值 */
    .frame-wrap .placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.28);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 12px 14px 6px;
    }
    .meta .id {
      color: var(--gold);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.08em;
    }
    .meta .name {
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-weight: 500;
    }
    .desc {
      padding: 0 14px 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
      letter-spacing: 0.02em;
    }
    .actions-row {
      display: flex;
      gap: 8px;
      padding: 0 14px 14px;
    }
    .actions-row a, .actions-row button {
      flex: 1;
      text-align: center;
      background: rgba(201,162,39,0.08);
      color: var(--gold);
      border: 1px solid var(--gold-soft);
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 6px;
      text-decoration: none;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    @media (min-width: 720px) {
      .feed { padding: 28px 24px 60px; }
      .topbar h1 { font-size: 17px; }
      .topbar .sub { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Cover Variants · 陈厂长 · 7 套候选</h1>
    <div class="sub">暗色黑金 · 信息密度优先 · 1080×1920 竖屏 · 无外部依赖（v01/02/07 已淘汰）</div>
    <div class="actions">
      <button id="reloadAll">↻ 重播全部</button>
      <select id="jump" onchange="document.getElementById(this.value)?.scrollIntoView({behavior:'smooth',block:'start'})">
        <option value="">跳转到…</option>
        <option value="card-v03">v03 数据瀑布</option>
        <option value="card-v04">v04 同心圆雷达</option>
        <option value="card-v05">v05 时间脊柱</option>
        <option value="card-v06">v06 多窗口分屏</option>
        <option value="card-v08">v08 金线绘制</option>
        <option value="card-v09">v09 3D 卡片堆叠</option>
        <option value="card-v10">v10 数据粒子云</option>
      </select>
    </div>
  </div>

  <div class="feed" id="feed"></div>

  <script>
    const variants = [
      { id: 'v03', name: '数据瀑布', desc: '数字从屏顶坠落，金色拖尾，弹性缓动' },
      { id: 'v04', name: '同心圆雷达', desc: 'SVG stroke 圆环绘制 + 扇形扫描 + KPI 标签点亮' },
      { id: 'v05', name: '时间脊柱', desc: '左侧金色时间脊柱，19 岁→现在 8 节点 stagger 点亮' },
      { id: 'v06', name: '多窗口分屏', desc: '6 格不对称网格，每 panel 一个 KPI 微动效（进度条/柱状/脉冲）' },
      { id: 'v08', name: '金线绘制', desc: 'SVG 字形描边 + 8 条辐射引线 stagger + 填色' },
      { id: 'v09', name: '3D 卡片堆叠', desc: 'perspective 翻牌 8 张金色 KPI 卡 + 名片定格' },
      { id: 'v10', name: '数据粒子云', desc: '80+ 金色文字粒子三层景深漂浮 + 中央描金主标题' },
    ];

    const feed = document.getElementById('feed');
    variants.forEach(v => {
      const file = `cover-${v.id}.html`;
      const html = `
        <div class="card" id="card-${v.id}">
          <div class="frame-wrap" data-src="${file}">
            <div class="placeholder">·  滚到此处加载  ·</div>
          </div>
          <div class="meta">
            <span class="id">${v.id}</span>
            <span class="name">${v.name}</span>
          </div>
          <div class="desc">${v.desc}</div>
          <div class="actions-row">
            <button data-reload="${v.id}">↻ 重播</button>
            <a href="${file}" target="_blank">1:1 全屏 →</a>
          </div>
        </div>`;
      feed.insertAdjacentHTML('beforeend', html);
    });

    // 按容器宽度计算 iframe scale，并在 viewport 内时加载 src
    function fitScale(wrap) {
      const iframe = wrap.querySelector('iframe');
      if (!iframe) return;
      const w = wrap.clientWidth;
      iframe.style.transform = `scale(${(w / 1080).toFixed(4)})`;
    }

    function mountIframe(wrap) {
      if (wrap.querySelector('iframe')) return;
      const src = wrap.dataset.src;
      const iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.setAttribute('scrolling', 'no');
      wrap.appendChild(iframe);
      const placeholder = wrap.querySelector('.placeholder');
      placeholder && placeholder.remove();
      requestAnimationFrame(() => fitScale(wrap));
    }
    function unmountIframe(wrap) {
      const iframe = wrap.querySelector('iframe');
      if (iframe) iframe.remove();
      if (!wrap.querySelector('.placeholder')) {
        const ph = document.createElement('div');
        ph.className = 'placeholder';
        ph.textContent = '·  滚到此处加载  ·';
        wrap.appendChild(ph);
      }
    }

    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const wrap = entry.target;
        if (entry.isIntersecting) {
          mountIframe(wrap);
        } else {
          // 离开视口卸载，避免手机性能压力（多个动画并发）
          unmountIframe(wrap);
        }
      });
    }, {
      root: null,
      rootMargin: '200px 0px 200px 0px',
      threshold: 0.01,
    });

    document.querySelectorAll('.frame-wrap').forEach(w => io.observe(w));

    // 重播：reload 当前 iframe
    feed.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-reload]');
      if (!btn) return;
      const id = btn.dataset.reload;
      const wrap = document.querySelector(`#card-${id} .frame-wrap`);
      const iframe = wrap?.querySelector('iframe');
      if (iframe) {
        iframe.src = iframe.src;
      } else if (wrap) {
        mountIframe(wrap);
      }
    });

    document.getElementById('reloadAll').addEventListener('click', () => {
      document.querySelectorAll('.frame-wrap iframe').forEach(f => f.src = f.src);
    });

    // 视口尺寸变化时重算 scale
    window.addEventListener('resize', () => {
      document.querySelectorAll('.frame-wrap').forEach(fitScale);
    });
  </script>
</body>
</html>
