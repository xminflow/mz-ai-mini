<!-- v05 时间脊柱 · slide-compare · 上下两段水平脊柱：上段 before（早期）→ 金色分隔扫线 → 下段 after（现在） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>slide-compare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #080808; color: #fff;
      font-family: 'Microsoft YaHei', 'PingFang SC', SimHei, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 关键帧 ── */
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drawLineX { to { stroke-dashoffset: 0; } }
    @keyframes spineGlowB {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.20)); }
      50%      { filter: drop-shadow(0 0 10px rgba(255,255,255,0.40)); }
    }
    @keyframes spineGlowA {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(232,196,107,0.65)); }
      50%      { filter: drop-shadow(0 0 18px rgba(232,196,107,0.95)); }
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(201,162,39,0.55); }
      50%      { box-shadow: 0 0 0 14px rgba(201,162,39,0); }
    }
    @keyframes sweepRight {
      from { transform: translateX(-100%); opacity: 0.0; }
      30%  { opacity: 1.0; }
      to   { transform: translateX(100%); opacity: 0.0; }
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    @keyframes lineGrowX {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* ── 舞台 ── */
    .stage {
      position: relative; width: 1080px; height: 1920px;
      background:
        radial-gradient(ellipse at 20% 25%, rgba(120,80,200,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 75%, rgba(201,162,39,0.10) 0%, transparent 55%),
        #0a0a0a;
      overflow: hidden;
    }
    .grid-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(201,162,39,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,162,39,0.035) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.5;
    }

    /* ── 顶部标签 + 标题 ── */
    .top-tag {
      position: absolute; top: 80px; left: 90px;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 28px; letter-spacing: 0.42em;
      color: rgba(255,255,255,0.32);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 0.4s ease 0.05s forwards;
    }
    .top-tag::before {
      content: ""; display: inline-block;
      width: 36px; height: 1px; background: rgba(201,162,39,0.6);
      vertical-align: middle; margin-right: 14px;
    }
    .title-block {
      position: absolute;
      top: 140px; left: 90px; right: 90px;
      opacity: 0;
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.18s forwards;
    }
    .slide-title {
      font-size: 54px; font-weight: 900;
      line-height: 1.18; letter-spacing: -0.01em;
      color: #ffffff;
    }
    .title-underline {
      margin-top: 22px;
      height: 2px; width: 100%;
      background: linear-gradient(to right, #f0d060, #c9a227, rgba(201,162,39,0.12));
      background-size: 200% 100%;
      border-radius: 2px;
      transform-origin: left center;
      animation: lineGrowX 0.5s cubic-bezier(0.22,1,0.36,1) 0.40s both,
                 shimmer  3s 1.2s linear infinite;
    }

    /* ── Compare 区：上下两段，每段独立水平脊柱 ── */
    .compare-wrap {
      position: absolute;
      top: 360px; bottom: 220px;
      left: 80px; right: 80px;
      display: flex; flex-direction: column;
    }

    /* 单段公共样式 */
    .segment {
      flex: 1;
      position: relative;
      padding: 30px 40px 30px 90px;
    }
    .segment .seg-tag {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 26px; font-weight: 600;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .segment .seg-text {
      font-size: 34px; font-weight: 400;
      line-height: 1.55;
    }

    /* 水平脊柱（每段一根） */
    .seg-spine {
      position: absolute;
      left: 30px; right: 30px;
      height: 56px;
      bottom: 30px;
    }
    .seg-spine svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }
    .seg-spine-line {
      stroke-width: 3; fill: none;
      stroke-dasharray: 920; stroke-dashoffset: 920;
    }
    .seg-spine-node {
      position: absolute; top: 50%;
      width: 18px; height: 18px;
      border: 2px solid currentColor;
      background: #0a0a0a;
      border-radius: 50%;
      transform: translateY(-50%);
      opacity: 0;
    }
    .seg-spine-node::after {
      content: ""; position: absolute; inset: 4px;
      background: currentColor; border-radius: 50%;
    }

    /* ── 上段 BEFORE：灰白脊柱 + 灰文字 ── */
    .seg-before {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px 16px 4px 4px;
      opacity: 0;
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.55s forwards;
    }
    .seg-before .seg-tag { color: rgba(255,255,255,0.55); }
    .seg-before .seg-text { color: rgba(255,255,255,0.62); }
    .seg-before .seg-spine-line {
      stroke: rgba(255,255,255,0.45);
      animation: drawLineX 0.9s ease-out 0.85s forwards,
                 spineGlowB 3s ease-in-out 3s infinite;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.20));
    }
    .seg-before .seg-spine-node { color: rgba(255,255,255,0.55); }
    .seg-before .sb-n1 { left:  6%; animation: fadeIn 0.3s ease 1.20s forwards; }
    .seg-before .sb-n2 { left: 30%; animation: fadeIn 0.3s ease 1.40s forwards; }
    .seg-before .sb-n3 { left: 58%; animation: fadeIn 0.3s ease 1.60s forwards; }
    .seg-before .sb-n4 { left: 86%; animation: fadeIn 0.3s ease 1.80s forwards; }

    /* ── 中央金色分隔扫线 ── */
    .divider-bar {
      position: relative;
      height: 6px;
      margin: 14px 0;
      overflow: hidden;
      background: linear-gradient(to right, transparent, rgba(201,162,39,0.30), transparent);
      border-radius: 3px;
      opacity: 0;
      animation: fadeIn 0.4s ease 2.4s forwards;
    }
    .divider-bar::before {
      content: "";
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to right, transparent 0%, #f0d060 45%, #ffffff 50%, #f0d060 55%, transparent 100%);
      box-shadow: 0 0 24px rgba(240,208,96,0.85);
      animation: sweepRight 1.6s cubic-bezier(0.4,0,0.2,1) 2.6s forwards;
    }
    .divider-tag {
      position: absolute;
      top: -36px; left: 50%; transform: translateX(-50%);
      font-family: Consolas, 'Courier New', monospace;
      font-size: 22px; letter-spacing: 0.30em;
      color: #c9a227;
      background: #0a0a0a; padding: 0 14px;
      opacity: 0;
      animation: fadeIn 0.4s ease 2.8s forwards;
    }

    /* ── 下段 AFTER：金色脊柱 + 白文字 ── */
    .seg-after {
      background: rgba(201,162,39,0.06);
      border: 1px solid rgba(201,162,39,0.40);
      border-radius: 4px 4px 16px 16px;
      opacity: 0;
      transform: translateY(20px);
      animation: afterIn 0.6s cubic-bezier(0.22,1,0.36,1) 3.3s forwards;
    }
    @keyframes afterIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .seg-after::before {
      content: "";
      position: absolute; left: 0; top: 20px; bottom: 20px;
      width: 4px;
      background: linear-gradient(to bottom, #f0d060, #c9a227, rgba(201,162,39,0.3));
    }
    .seg-after .seg-tag { color: #c9a227; }
    .seg-after .seg-text { color: rgba(255,255,255,0.94); }
    .seg-after .seg-spine-line {
      stroke: #c9a227;
      animation: drawLineX 0.9s ease-out 3.6s forwards,
                 spineGlowA 2.4s ease-in-out 5s infinite;
      filter: drop-shadow(0 0 8px rgba(201,162,39,0.65));
    }
    .seg-after .seg-spine-node {
      color: #c9a227;
      animation: dotIn 0.3s ease both, dotPulse 2.2s ease-in-out infinite;
    }
    @keyframes dotIn {
      from { transform: translateY(-50%) scale(0.2); opacity: 0; }
      to   { transform: translateY(-50%) scale(1.0); opacity: 1; }
    }
    .seg-after .sa-n1 { left:  6%; animation-delay: 3.90s, 5.5s; }
    .seg-after .sa-n2 { left: 30%; animation-delay: 4.10s, 5.5s; }
    .seg-after .sa-n3 { left: 58%; animation-delay: 4.30s, 5.5s; }
    .seg-after .sa-n4 { left: 86%; animation-delay: 4.50s, 5.5s; }

    /* ── 底部品牌 ── */
    .brand-footer {
      position: absolute;
      bottom: 80px; left: 90px;
      display: flex; align-items: center; gap: 18px;
      opacity: 0;
      animation: fadeIn 0.5s ease 5.2s forwards;
    }
    .brand-w {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 46px; font-weight: 700;
      color: #c9a227; line-height: 1;
      text-shadow: 0 0 20px rgba(201,162,39,0.45);
    }
    .brand-name {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 32px; font-weight: 400;
      letter-spacing: 0.52em; color: rgba(255,255,255,0.42);
      text-transform: uppercase;
    }

    .duration-debug {
      position: absolute; bottom: 14px; right: 22px; z-index: 99;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 10px; color: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="grid-bg"></div>

    <div class="top-tag">GROWTH MOVE · 成 长 动 作</div>

    <div class="title-block">
      <div class="slide-title">他怎么把这件事放大</div>
      <div class="title-underline" aria-hidden="true"></div>
    </div>

    <!-- 对照区 -->
    <div class="compare-wrap">
      <!-- 上段 BEFORE -->
      <div class="segment seg-before">
        <div class="seg-tag">做对的事 · RIGHT MOVE</div>
        <div class="seg-text">早期就抓住了'反直觉强结论当开场'这件事，靠暗调茶台 + 顶部红黄双行字打开人</div>
        <div class="seg-spine">
          <svg viewBox="0 0 920 56" preserveAspectRatio="none">
            <line class="seg-spine-line" x1="0" y1="28" x2="920" y2="28"/>
          </svg>
          <span class="seg-spine-node sb-n1"></span>
          <span class="seg-spine-node sb-n2"></span>
          <span class="seg-spine-node sb-n3"></span>
          <span class="seg-spine-node sb-n4"></span>
        </div>
      </div>

      <!-- 中央金色扫线分隔 -->
      <div class="divider-bar" aria-hidden="true">
        <span class="divider-tag">SCALE UP</span>
      </div>

      <!-- 下段 AFTER -->
      <div class="segment seg-after">
        <div class="seg-tag">把它放大 · SCALE UP</div>
        <div class="seg-text">现在七套场景，从白衣修行到 AI 操盘到政经叙事，都焊在同一行红黄双标题上</div>
        <div class="seg-spine">
          <svg viewBox="0 0 920 56" preserveAspectRatio="none">
            <line class="seg-spine-line" x1="0" y1="28" x2="920" y2="28"/>
          </svg>
          <span class="seg-spine-node sa-n1"></span>
          <span class="seg-spine-node sa-n2"></span>
          <span class="seg-spine-node sa-n3"></span>
          <span class="seg-spine-node sa-n4"></span>
        </div>
      </div>
    </div>

    <div class="brand-footer">
      <span class="brand-w">W</span>
      <span class="brand-name">微域生光</span>
    </div>

    <div class="duration-debug">18400ms</div>
  </div>
</body>
</html>
