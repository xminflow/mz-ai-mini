<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>slide-cta — 微域生光</title>
<!-- v09 3D 卡片堆叠 · slide-cta · 中央最终名片定格 + 下方半露装饰金边卡片堆叠 -->
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#080808;font-family:'Microsoft YaHei','PingFang SC',SimHei,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

  .stage{
    position:relative;width:1080px;height:1920px;
    background:
      radial-gradient(ellipse 700px 500px at 50% 50%, rgba(201,162,39,0.20), transparent 70%),
      radial-gradient(ellipse 900px 700px at 50% 95%, rgba(180,100,20,0.12), transparent 70%),
      linear-gradient(180deg,#0a0a0a 0%,#080808 60%,#050505 100%);
    overflow:hidden;
  }

  /* 中央呼吸光 */
  .glow{
    position:absolute;left:50%;top:50%;
    width:900px;height:900px;margin-left:-450px;margin-top:-450px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(201,162,39,0.18) 0%,rgba(201,162,39,0.06) 35%,transparent 65%);
    animation:glowPulse 3.6s ease-in-out 1.5s infinite;
    pointer-events:none;
  }
  @keyframes glowPulse{
    0%,100%{opacity:0.5;transform:scale(1)}
    50%{opacity:0.9;transform:scale(1.1)}
  }

  /* 顶部小字 */
  .topline{
    position:absolute;top:120px;left:0;right:0;text-align:center;
    font-family:Consolas,'Courier New',monospace;
    font-size:28px;letter-spacing:14px;color:rgba(232,196,107,0.78);
    opacity:0;animation:topIn 0.5s ease 0.2s forwards;
  }
  .topline::before,.topline::after{content:"";display:inline-block;width:60px;height:1px;background:#c9a227;vertical-align:middle;margin:0 18px}
  @keyframes topIn{to{opacity:1}}

  /* 底部脚标 */
  .footer{
    position:absolute;bottom:110px;left:0;right:0;text-align:center;
    font-size:22px;letter-spacing:10px;color:#c9a227;
    opacity:0;animation:footIn 0.8s ease 2.5s forwards;
  }
  .footer::before,.footer::after{content:"";display:inline-block;width:60px;height:1px;background:linear-gradient(90deg,transparent,#c9a227,transparent);vertical-align:middle;margin:0 24px}
  @keyframes footIn{to{opacity:1}}

  /* 3D 舞台 */
  .deck-wrap{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:900px;height:1300px;
    perspective:1800px;
    perspective-origin:50% 40%;
  }
  .deck{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
  }

  /* 装饰卡基类（半露金边） */
  .deco-card{
    position:absolute;left:50%;top:50%;
    width:680px;height:880px;margin-left:-340px;margin-top:-440px;
    border-radius:30px;
    background:linear-gradient(160deg,#1a1408 0%,#221a0c 50%,#100c06 100%);
    border:2px solid #c9a227;
    box-shadow:
      0 24px 50px rgba(0,0,0,0.6),
      0 10px 22px rgba(0,0,0,0.5);
    transform-style:preserve-3d;
    will-change:transform,opacity;
    opacity:0;
  }
  /* 卡四角金角效果 */
  .deco-card::after{
    content:"";position:absolute;inset:14px;border-radius:22px;pointer-events:none;
    background:
      linear-gradient(135deg,#e8c46b 0%,transparent 6%,transparent 94%,#e8c46b 100%) 0 0/100% 100%,
      linear-gradient(45deg,#e8c46b 0%,transparent 6%,transparent 94%,#e8c46b 100%) 0 0/100% 100%;
    mix-blend-mode:overlay;opacity:0.25;
  }

  /* 4 张装饰半露卡：从下方升起，露 1cm 金边 */
  .deco-card.d1{
    z-index:1;
    transform:translateZ(0) translateY(440px) translateX(-30px) rotateZ(-3deg);
    animation:decoIn1 0.9s cubic-bezier(.2,.7,.2,1) 0.2s forwards;
  }
  .deco-card.d2{
    z-index:2;
    transform:translateZ(10px) translateY(400px) translateX(20px) rotateZ(2deg);
    animation:decoIn2 0.9s cubic-bezier(.2,.7,.2,1) 0.4s forwards;
  }
  .deco-card.d3{
    z-index:3;
    transform:translateZ(20px) translateY(360px) translateX(-15px) rotateZ(-2deg);
    animation:decoIn3 0.9s cubic-bezier(.2,.7,.2,1) 0.6s forwards;
  }
  .deco-card.d4{
    z-index:4;
    transform:translateZ(30px) translateY(320px) translateX(10px) rotateZ(1.5deg);
    animation:decoIn4 0.9s cubic-bezier(.2,.7,.2,1) 0.8s forwards;
  }

  @keyframes decoIn1{
    0%{opacity:0;transform:translateZ(0) translateY(900px) translateX(-30px) rotateZ(-3deg)}
    100%{opacity:1;transform:translateZ(0) translateY(440px) translateX(-30px) rotateZ(-3deg)}
  }
  @keyframes decoIn2{
    0%{opacity:0;transform:translateZ(10px) translateY(900px) translateX(20px) rotateZ(2deg)}
    100%{opacity:1;transform:translateZ(10px) translateY(400px) translateX(20px) rotateZ(2deg)}
  }
  @keyframes decoIn3{
    0%{opacity:0;transform:translateZ(20px) translateY(900px) translateX(-15px) rotateZ(-2deg)}
    100%{opacity:1;transform:translateZ(20px) translateY(360px) translateX(-15px) rotateZ(-2deg)}
  }
  @keyframes decoIn4{
    0%{opacity:0;transform:translateZ(30px) translateY(900px) translateX(10px) rotateZ(1.5deg)}
    100%{opacity:1;transform:translateZ(30px) translateY(320px) translateX(10px) rotateZ(1.5deg)}
  }

  /* 主名片：超大金色卡居中 */
  .name-card{
    position:absolute;left:50%;top:50%;
    width:780px;height:980px;margin-left:-390px;margin-top:-490px;
    border-radius:36px;
    background:
      radial-gradient(ellipse 500px 500px at 50% 28%,rgba(201,162,39,0.28),transparent 70%),
      linear-gradient(160deg,#1a1408 0%,#2a1f0c 50%,#100c06 100%);
    border:3px solid #e8c46b;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.7),
      0 16px 36px rgba(0,0,0,0.6),
      0 0 80px rgba(201,162,39,0.32),
      inset 0 0 0 1px rgba(232,196,107,0.40);
    transform-style:preserve-3d;
    backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 60px;
    z-index:10;
    transform:translateZ(80px) translateY(-1100px) rotateX(-30deg) scale(0.8);
    opacity:0;
    animation:nameIn 1.4s cubic-bezier(.2,.7,.2,1) 1.0s forwards,nameBreathe 3.6s ease-in-out 3.0s infinite;
    will-change:transform,opacity;
  }
  .name-card::before{
    content:"";position:absolute;inset:18px;border:1px solid rgba(232,196,107,0.45);border-radius:24px;pointer-events:none;
  }
  .name-card::after{
    content:"";position:absolute;inset:14px;border-radius:26px;pointer-events:none;
    background:
      linear-gradient(135deg,#e8c46b 0%,transparent 8%,transparent 92%,#e8c46b 100%) 0 0/100% 100%,
      linear-gradient(45deg,#e8c46b 0%,transparent 8%,transparent 92%,#e8c46b 100%) 0 0/100% 100%;
    mix-blend-mode:overlay;opacity:0.30;
  }
  @keyframes nameIn{
    0%{opacity:0;transform:translateZ(80px) translateY(-1100px) rotateX(-30deg) scale(0.8)}
    70%{opacity:1;transform:translateZ(280px) translateY(40px) rotateX(8deg) scale(1.05)}
    100%{opacity:1;transform:translateZ(80px) translateY(0) rotateX(0deg) scale(1)}
  }
  @keyframes nameBreathe{
    0%,100%{filter:drop-shadow(0 0 0 rgba(201,162,39,0))}
    50%{filter:drop-shadow(0 0 22px rgba(201,162,39,0.40))}
  }

  .name-card .deco{
    position:absolute;left:0;right:0;display:flex;justify-content:center;gap:14px;
  }
  .name-card .deco.top{top:60px}
  .name-card .deco.bot{bottom:60px}
  .name-card .deco i{display:block;width:6px;height:6px;background:#c9a227;border-radius:50%;opacity:0.85}
  .name-card .deco i:nth-child(2),.name-card .deco i:nth-child(4){width:24px;border-radius:3px}

  .name-card .brand-mark{
    font-family:Consolas,'Courier New',monospace;
    font-size:120px;font-weight:700;line-height:1;
    color:#c9a227;
    text-shadow:0 0 30px rgba(201,162,39,0.55),0 0 60px rgba(201,162,39,0.25);
    margin-bottom:40px;
  }

  .name-card .brand-name{
    font-size:120px;font-weight:900;line-height:1;letter-spacing:6px;
    background:linear-gradient(180deg,#fff 0%,#fff7d9 40%,#e8c46b 75%,#c9a227 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 40px rgba(201,162,39,0.5);
    text-align:center;
  }

  .name-card .divider{
    width:140px;height:2px;
    margin:50px auto;
    background:linear-gradient(90deg,transparent,#e8c46b,#c9a227,#e8c46b,transparent);
  }

  .name-card .tagline{
    font-size:34px;font-weight:500;line-height:1.55;letter-spacing:6px;
    color:rgba(255,255,255,0.92);
    text-align:center;
  }
  .name-card .tagline .sep{color:#e8c46b;margin:0 6px}

  .name-card .handle{
    margin-top:50px;
    font-family:Consolas,'Courier New',monospace;
    font-size:24px;font-weight:600;letter-spacing:6px;
    color:#c9a227;
    padding:14px 36px;border:1px solid rgba(201,162,39,0.5);border-radius:40px;
  }

  .duration-debug{
    position:absolute;bottom:14px;right:22px;z-index:99;
    font-family:Consolas,'Courier New',monospace;
    font-size:10px;color:rgba(255,255,255,0.12);
  }
</style>
</head>
<body>
<div class="stage">

  <div class="glow"></div>

  <div class="topline">真 实 博 主 拆 解</div>

  <div class="deck-wrap">
    <div class="deck">

      <!-- 装饰半露卡片堆叠在主名片下方 -->
      <div class="deco-card d1"></div>
      <div class="deco-card d2"></div>
      <div class="deco-card d3"></div>
      <div class="deco-card d4"></div>

      <!-- 主名片：微域生光 -->
      <div class="name-card">
        <div class="deco top"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="deco bot"><i></i><i></i><i></i><i></i><i></i></div>

        <div class="brand-mark">W</div>
        <div class="brand-name">微域生光</div>
        <div class="divider"></div>
        <div class="tagline">真实博主拆解<span class="sep">·</span>真实数据<span class="sep">·</span>真实增长</div>
        <div class="handle">M O R E   B R E A K D O W N</div>
      </div>

    </div>
  </div>

  <div class="footer">微 域 生 光 · 内 容 + A I 双 引 擎</div>

  <div class="duration-debug">8200ms</div>
</div>
</body>
</html>
