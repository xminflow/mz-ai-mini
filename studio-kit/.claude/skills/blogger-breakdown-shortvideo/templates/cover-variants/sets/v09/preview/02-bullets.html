<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>slide-bullets — 他干对了三件事</title>
<!-- v09 3D 卡片堆叠 · slide-bullets · 每条 bullet 是一张金色卡片，扇形扑克牌 stagger 飞入 -->
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#080808;font-family:'Microsoft YaHei','PingFang SC',SimHei,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

  .stage{
    position:relative;width:1080px;height:1920px;
    background:
      radial-gradient(ellipse 700px 500px at 50% 60%, rgba(201,162,39,0.16), transparent 70%),
      radial-gradient(ellipse 900px 700px at 50% 95%, rgba(180,100,20,0.10), transparent 70%),
      linear-gradient(180deg,#0a0a0a 0%,#080808 60%,#050505 100%);
    overflow:hidden;
  }

  /* 顶部小字 */
  .topline{
    position:absolute;top:90px;left:0;right:0;text-align:center;
    font-family:Consolas,'Courier New',monospace;
    font-size:28px;letter-spacing:14px;color:rgba(232,196,107,0.75);
    opacity:0;animation:topIn 0.5s ease 0.2s forwards;
  }
  .topline::before,.topline::after{content:"";display:inline-block;width:60px;height:1px;background:#c9a227;vertical-align:middle;margin:0 18px}
  @keyframes topIn{to{opacity:1}}

  /* 标题：用 他干对了三件事 */
  .title{
    position:absolute;top:200px;left:0;right:0;text-align:center;
    font-size:72px;font-weight:900;line-height:1.2;letter-spacing:-0.01em;
    color:#fff;padding:0 80px;
    opacity:0;animation:titleIn 0.6s cubic-bezier(.2,.7,.2,1) 0.4s forwards;
  }
  .title::after{
    content:"";display:block;width:160px;height:3px;margin:32px auto 0;
    background:linear-gradient(90deg,transparent,#e8c46b,#c9a227,#e8c46b,transparent);
    border-radius:2px;
  }
  @keyframes titleIn{
    0%{opacity:0;transform:translateY(30px)}
    100%{opacity:1;transform:translateY(0)}
  }

  /* 底部脚标 */
  .footer{
    position:absolute;bottom:90px;left:0;right:0;text-align:center;
    font-size:22px;letter-spacing:10px;color:#c9a227;
    opacity:0;animation:footIn 0.8s ease 13.5s forwards;
  }
  .footer::before,.footer::after{content:"";display:inline-block;width:60px;height:1px;background:linear-gradient(90deg,transparent,#c9a227,transparent);vertical-align:middle;margin:0 24px}
  @keyframes footIn{to{opacity:1}}

  /* 3D 舞台 — 卡片堆放在屏幕中央偏下 */
  .deck-wrap{
    position:absolute;left:50%;top:1100px;
    transform:translate(-50%,-50%);
    width:900px;height:1100px;
    perspective:1800px;
    perspective-origin:50% 40%;
  }
  .bullets-list{
    list-style:none;
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
  }

  /* 卡片基类 */
  .bullets-list .stagger-item{
    position:absolute;left:50%;top:50%;
    width:720px;min-height:170px;
    margin-left:-360px;margin-top:-85px;
    border-radius:28px;
    background:
      linear-gradient(160deg,#1a1408 0%,#221a0c 50%,#100c06 100%);
    border:2px solid #c9a227;
    box-shadow:
      0 24px 50px rgba(0,0,0,0.6),
      0 10px 22px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(232,196,107,0.18);
    transform-style:preserve-3d;
    backface-visibility:hidden;
    display:flex;align-items:center;gap:28px;
    padding:32px 44px;
    font-size:34px;font-weight:500;line-height:1.45;
    color:rgba(255,255,255,0.92);
    counter-increment:bullet-counter;
    will-change:transform,opacity;
    opacity:0;
  }
  .bullets-list{counter-reset:bullet-counter}
  /* 内描金细框 */
  .bullets-list .stagger-item::before{
    content:counter(bullet-counter);
    flex-shrink:0;
    width:62px;height:62px;border-radius:50%;
    background:linear-gradient(180deg,#e8c46b 0%,#c9a227 100%);
    color:#1a1408;
    font-family:'Inter','SF Pro Display',system-ui,sans-serif;
    font-size:36px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(201,162,39,0.5),inset 0 1px 0 rgba(255,247,217,0.7);
  }
  .bullets-list .stagger-item::after{
    content:"";position:absolute;inset:10px;border:1px solid rgba(232,196,107,0.32);border-radius:20px;pointer-events:none;
  }

  /* 扇形 stagger：6 张错位堆叠
     初始：远处 + 旋转 + 透明 → 末态扇形错位
     stagger 间隔 0.5s，每张持续 0.8s 飞入 → 末态 ≥1.5s 定格
     总时长 ~16s（标题 0.4 + 6 张 × 间隔 ≈ 3.4s 飞完 + 定格 ≥ 10s 让镜头充分扫读）
  */
  @keyframes bulletFly{
    0%{opacity:0;transform:translateZ(-600px) translateY(-80px) rotateX(-40deg) rotateZ(0deg)}
    60%{opacity:1;transform:translateZ(60px) translateY(0) rotateX(5deg) rotateZ(0deg)}
    100%{opacity:1;transform:translateZ(0) translateY(0) rotateX(0deg) rotateZ(0deg)}
  }

  /* 6 张卡片的末态错位（像扑克扇形展开）
     stagger 间隔 2.2s，每张 1.2s 飞入；6 张 ≈ 13s 飞完，再定格 ≥ 1.5s 让镜头扫读 */
  .bullets-list .stagger-item:nth-child(1){
    z-index:1;
    transform:translateZ(0) translateY(-280px) translateX(-60px) rotateZ(-6deg);
    animation:fly1 1.2s cubic-bezier(.2,.7,.2,1) 0.8s forwards;
  }
  .bullets-list .stagger-item:nth-child(2){
    z-index:2;
    transform:translateZ(8px) translateY(-180px) translateX(40px) rotateZ(4deg);
    animation:fly2 1.2s cubic-bezier(.2,.7,.2,1) 3.0s forwards;
  }
  .bullets-list .stagger-item:nth-child(3){
    z-index:3;
    transform:translateZ(16px) translateY(-60px) translateX(-50px) rotateZ(-3deg);
    animation:fly3 1.2s cubic-bezier(.2,.7,.2,1) 5.2s forwards;
  }
  .bullets-list .stagger-item:nth-child(4){
    z-index:4;
    transform:translateZ(24px) translateY(60px) translateX(60px) rotateZ(5deg);
    animation:fly4 1.2s cubic-bezier(.2,.7,.2,1) 7.4s forwards;
  }
  .bullets-list .stagger-item:nth-child(5){
    z-index:5;
    transform:translateZ(32px) translateY(180px) translateX(-40px) rotateZ(-4deg);
    animation:fly5 1.2s cubic-bezier(.2,.7,.2,1) 9.6s forwards;
  }
  .bullets-list .stagger-item:nth-child(6){
    z-index:6;
    transform:translateZ(40px) translateY(290px) translateX(30px) rotateZ(3deg);
    animation:fly6 1.2s cubic-bezier(.2,.7,.2,1) 11.8s forwards;
  }

  @keyframes fly1{
    0%{opacity:0;transform:translateZ(-700px) translateY(-1000px) translateX(-300px) rotateZ(-30deg) rotateX(-40deg)}
    60%{opacity:1;transform:translateZ(100px) translateY(-260px) translateX(-60px) rotateZ(-4deg) rotateX(3deg)}
    100%{opacity:1;transform:translateZ(0) translateY(-280px) translateX(-60px) rotateZ(-6deg) rotateX(0deg)}
  }
  @keyframes fly2{
    0%{opacity:0;transform:translateZ(-700px) translateY(-900px) translateX(300px) rotateZ(28deg) rotateX(-38deg)}
    60%{opacity:1;transform:translateZ(110px) translateY(-160px) translateX(40px) rotateZ(6deg) rotateX(3deg)}
    100%{opacity:1;transform:translateZ(8px) translateY(-180px) translateX(40px) rotateZ(4deg) rotateX(0deg)}
  }
  @keyframes fly3{
    0%{opacity:0;transform:translateZ(-700px) translateY(-800px) translateX(-280px) rotateZ(-22deg) rotateX(-36deg)}
    60%{opacity:1;transform:translateZ(120px) translateY(-40px) translateX(-50px) rotateZ(-1deg) rotateX(3deg)}
    100%{opacity:1;transform:translateZ(16px) translateY(-60px) translateX(-50px) rotateZ(-3deg) rotateX(0deg)}
  }
  @keyframes fly4{
    0%{opacity:0;transform:translateZ(-700px) translateY(-700px) translateX(280px) rotateZ(24deg) rotateX(-34deg)}
    60%{opacity:1;transform:translateZ(130px) translateY(80px) translateX(60px) rotateZ(7deg) rotateX(3deg)}
    100%{opacity:1;transform:translateZ(24px) translateY(60px) translateX(60px) rotateZ(5deg) rotateX(0deg)}
  }
  @keyframes fly5{
    0%{opacity:0;transform:translateZ(-700px) translateY(-600px) translateX(-260px) rotateZ(-20deg) rotateX(-32deg)}
    60%{opacity:1;transform:translateZ(140px) translateY(200px) translateX(-40px) rotateZ(-2deg) rotateX(3deg)}
    100%{opacity:1;transform:translateZ(32px) translateY(180px) translateX(-40px) rotateZ(-4deg) rotateX(0deg)}
  }
  @keyframes fly6{
    0%{opacity:0;transform:translateZ(-700px) translateY(-500px) translateX(260px) rotateZ(20deg) rotateX(-30deg)}
    60%{opacity:1;transform:translateZ(150px) translateY(310px) translateX(30px) rotateZ(5deg) rotateX(3deg)}
    100%{opacity:1;transform:translateZ(40px) translateY(290px) translateX(30px) rotateZ(3deg) rotateX(0deg)}
  }

  /* 末态轻微呼吸（让定格不死） */
  .bullets-list .stagger-item{
    /* shadow 的呼吸用 filter，避免覆盖 transform 动画 */
  }

  .duration-debug{
    position:absolute;bottom:14px;right:22px;z-index:99;
    font-family:Consolas,'Courier New',monospace;
    font-size:10px;color:rgba(255,255,255,0.12);
  }
</style>
</head>
<body>
<div class="stage">

  <div class="topline">K E Y   P O I N T S</div>

  <div class="title">他干对了三件事</div>

  <div class="deck-wrap">
    <!--
      <li class="stagger-item">顶部红黄双行大字 = 视觉锤</li><li class="stagger-item">'X 必须得 Y' = 文字钉</li><li class="stagger-item">聊观点脚本 = 唯一骨架</li> 由 Python 注入：<li class="stagger-item">内容</li>
      最多 6 条；多余的 nth-child 没有动画也不会显示
    -->
    <ul class="bullets-list">
      <li class="stagger-item">顶部红黄双行大字 = 视觉锤</li><li class="stagger-item">'X 必须得 Y' = 文字钉</li><li class="stagger-item">聊观点脚本 = 唯一骨架</li>
    </ul>
  </div>

  <div class="footer">微 域 生 光 · 真 实 博 主 拆 解</div>

  <div class="duration-debug">21600ms</div>
</div>
</body>
</html>
