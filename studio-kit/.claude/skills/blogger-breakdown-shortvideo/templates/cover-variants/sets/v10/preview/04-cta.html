<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>slide-cta — 微域生光</title>
<!-- v10 数据粒子云 · slide-cta · 整屏粒子云缓慢漂浮，中央"微域生光"四个金色大字从粒子中凝聚 → 描金 → 填实色 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#080808;font-family:'Microsoft YaHei','PingFang SC',SimHei,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

  .stage{
    position:relative;width:1080px;height:1920px;
    background:
      radial-gradient(ellipse 900px 800px at 50% 50%, rgba(201,162,39,0.18), transparent 65%),
      radial-gradient(ellipse 600px 600px at 20% 20%, rgba(180,100,20,0.10), transparent 65%),
      radial-gradient(ellipse 500px 500px at 80% 80%, rgba(201,162,39,0.10), transparent 65%),
      linear-gradient(160deg,#080808 0%,#0c0a04 50%,#080808 100%);
    overflow:hidden;
  }

  .frame-corner{position:absolute;width:24px;height:24px;border:2px solid #c9a227;z-index:5}
  .fc-tl{top:48px;left:48px;border-right:none;border-bottom:none}
  .fc-tr{top:48px;right:48px;border-left:none;border-bottom:none}
  .fc-bl{bottom:48px;left:48px;border-right:none;border-top:none}
  .fc-br{bottom:48px;right:48px;border-left:none;border-top:none}

  /* 粒子层（整屏） */
  .cloud{position:absolute;inset:0;z-index:1}

  .p{
    position:absolute;
    font-family:'Inter','SF Pro Display','Microsoft YaHei',sans-serif;
    font-weight:700;
    color:#e8c46b;
    white-space:nowrap;
    text-shadow:0 0 12px rgba(201,162,39,0.4);
    opacity:0;
    will-change:transform,opacity;
  }
  .p.amber{color:rgba(232,180,90,0.78);text-shadow:0 0 14px rgba(180,100,20,0.5)}
  .p.dim{color:rgba(201,162,39,0.5);font-weight:500;text-shadow:none}
  .p.huge{font-weight:900}
  .p.cjk{font-family:'Microsoft YaHei','PingFang SC',SimHei,sans-serif}

  @keyframes fanIn{
    0%{transform:translate3d(var(--ox,0),var(--oy,0),-200px) scale(0.4);opacity:0}
    100%{transform:translate3d(0,0,0) scale(1);opacity:var(--op,0.7)}
  }
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(var(--dx,8px),var(--dy,-10px),0) scale(1.02)}
  }
  .p{
    animation:
      fanIn 1.2s cubic-bezier(.2,.7,.2,1) var(--d,0s) both,
      float var(--fd,7s) ease-in-out calc(1.2s + var(--d,0s)) infinite;
  }

  /* 中央光环（呼吸） */
  .halo{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle, rgba(201,162,39,0.18) 0%, rgba(201,162,39,0.05) 40%, transparent 65%);
    z-index:2;opacity:0;
    animation:haloIn 1.0s ease-out 0.8s forwards, haloPulse 3.5s ease-in-out 2.0s infinite;
  }
  @keyframes haloIn{to{opacity:1}}
  @keyframes haloPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.85}
    50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}
  }

  /* 中央"微域生光"四个字 — 凝聚 → 描金 → 填实色 */
  .brand-wrap{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;z-index:10;
  }
  .brand-name{
    display:flex;justify-content:center;gap:32px;
  }
  .brand-name .ch{
    font-family:'Microsoft YaHei','PingFang SC',SimHei,sans-serif;
    font-size:220px;font-weight:900;line-height:1;letter-spacing:0;
    color:transparent;
    -webkit-text-stroke:2px #e8c46b;
    text-shadow:0 0 40px rgba(201,162,39,0.6);
    opacity:0;
    transform:scale(1.6);
    filter:blur(20px);
    animation:chCondense 1.2s cubic-bezier(.2,.7,.2,1) var(--d,1.4s) forwards;
  }
  @keyframes chCondense{
    0%{opacity:0;transform:scale(1.6);filter:blur(20px);-webkit-text-stroke:0px #e8c46b;text-shadow:none}
    60%{opacity:1;transform:scale(0.96);filter:blur(0);-webkit-text-stroke:2px #e8c46b;text-shadow:0 0 40px rgba(201,162,39,0.7)}
    100%{opacity:1;transform:scale(1);filter:blur(0);-webkit-text-stroke:2px #e8c46b;text-shadow:0 0 32px rgba(201,162,39,0.6)}
  }
  .brand-name .ch.c1{--d:1.4s}
  .brand-name .ch.c2{--d:1.65s}
  .brand-name .ch.c3{--d:1.9s}
  .brand-name .ch.c4{--d:2.15s}

  /* 描金后填实色 — 实色金渐变层叠加上去 */
  .brand-name .ch::after{
    content:attr(data-ch);
    position:absolute;left:0;top:0;width:100%;height:100%;
    background:linear-gradient(180deg,#fff 0%,#fff7d9 35%,#e8c46b 70%,#c9a227 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    -webkit-text-stroke:0;
    opacity:0;
    animation:chFill 0.8s ease-out calc(var(--d,1.4s) + 1.0s) forwards;
  }
  .brand-name .ch{position:relative}
  @keyframes chFill{to{opacity:1}}

  /* 装饰横线 */
  .center-divider{
    margin-top:60px;
    width:300px;height:2px;
    background:linear-gradient(to right,transparent,#fff7d9,#e8c46b,#c9a227,#e8c46b,#fff7d9,transparent);
    background-size:200% 100%;
    transform-origin:center;transform:scaleX(0);
    margin-left:auto;margin-right:auto;
    animation:lineGrow 0.7s cubic-bezier(.2,.7,.2,1) 3.5s forwards, shimmer 2.6s 4.2s linear infinite;
  }
  @keyframes lineGrow{to{transform:scaleX(1)}}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

  /* 副标 */
  .brand-subtitle{
    margin-top:54px;
    font-size:54px;font-weight:500;letter-spacing:16px;
    color:rgba(255,255,255,0.92);text-align:center;
    opacity:0;animation:subIn 0.8s ease-out 4.0s forwards;
  }
  .brand-subtitle .dot{color:#e8c46b;margin:0 14px}
  @keyframes subIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  /* 底部品牌脚标 */
  .brand-footer{
    position:absolute;bottom:120px;left:0;right:0;
    text-align:center;
    font-family:Consolas,'Courier New',monospace;
    font-size:24px;letter-spacing:12px;color:rgba(201,162,39,0.65);
    opacity:0;animation:subIn 0.6s ease 4.5s forwards;
  }
  .brand-footer::before,.brand-footer::after{content:"";display:inline-block;width:40px;height:1px;background:#c9a227;vertical-align:middle;margin:0 14px}

  .duration-debug{position:absolute;bottom:14px;right:22px;z-index:99;font-family:Consolas,'Courier New',monospace;font-size:10px;color:rgba(255,255,255,0.12)}
</style>
</head>
<body>
