<!DOCTYPE html>
<html lang="zh-CN">
<!-- v06 多窗口分屏 · slide-compare · 顶部 title 贯穿 panel + 左右两大对照 panel（before 暗淡 / after 丰富，含多个微动效）+ 中间金色分隔线 -->
<head>
  <meta charset="UTF-8">
  <title>slide-compare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #080808; color: #fff;
      font-family: 'Microsoft YaHei', 'PingFang SC', SimHei, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative; width: 1080px; height: 1920px;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(120,80,200,0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 85%, rgba(201,162,39,0.09) 0%, transparent 60%),
        #080808;
    }

    /* 顶部 ticker */
    .topbar {
      position: absolute; top: 0; left: 0;
      width: 1080px; height: 46px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid rgba(201,162,39,0.35);
      background: rgba(8,8,8,0.6);
      z-index: 10;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px; letter-spacing: 0.18em;
      color: rgba(232,196,107,0.9);
    }
    .topbar .dot {
      display: inline-block; width: 8px; height: 8px;
      background: #c9a227; border-radius: 50%;
      margin-right: 10px; animation: blink 1.4s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    .grid {
      position: absolute; top: 46px; left: 0;
      width: 1080px; height: 1874px;
      padding: 24px;
    }

    /* 顶部贯穿 title panel */
    .title-panel {
      position: relative;
      width: 100%; height: 240px;
      background:
        linear-gradient(135deg, rgba(201,162,39,0.08) 0%, rgba(8,8,8,0) 60%),
        rgba(14,14,14,0.7);
      border: 1px solid rgba(201,162,39,0.45);
      padding: 32px 40px;
      opacity: 0; transform: translateY(20px);
      animation: panelIn 0.55s cubic-bezier(.2,.7,.2,1) 0ms forwards;
      overflow: hidden;
    }
    @keyframes panelIn { to { opacity: 1; transform: translateY(0); } }
    .title-panel .label {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 18px; letter-spacing: 0.28em;
      color: rgba(232,196,107,0.78);
      margin-bottom: 14px;
    }
    .title-panel .slide-title {
      font-size: 56px; font-weight: 900;
      line-height: 1.15; letter-spacing: -0.01em;
      color: #fff;
    }
    .title-panel .tag {
      position: absolute; top: 32px; right: 40px;
      font-family: 'Inter', system-ui, monospace;
      font-size: 16px; letter-spacing: 0.22em;
      color: rgba(255,255,255,0.4);
    }

    /* 对照 wrapper：左右两 panel + 中线 */
    .compare-wrap {
      position: relative;
      width: 100%;
      margin-top: 18px;
      height: calc(1874px - 48px - 240px - 18px - 60px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    /* 中央金色分隔线 */
    .compare-wrap::before {
      content: "";
      position: absolute; left: 50%; top: 24px; bottom: 24px;
      width: 2px; transform: translateX(-50%);
      background: linear-gradient(to bottom, transparent, #f0d060, #c9a227, #f0d060, transparent);
      box-shadow: 0 0 18px rgba(201,162,39,0.5);
      animation: lineY 0.7s ease 0.3s both;
    }
    @keyframes lineY { from { opacity: 0; transform: translateX(-50%) scaleY(0); transform-origin: top; } to { opacity: 1; transform: translateX(-50%) scaleY(1); } }
    /* 中央 VS 节点 */
    .compare-wrap::after {
      content: "VS";
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      background: #080808;
      border: 1px solid #c9a227;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 20px; font-weight: 800;
      color: #e8c46b;
      letter-spacing: 0.15em;
      z-index: 5;
      opacity: 0;
      animation: vsIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.8s forwards;
    }
    @keyframes vsIn { to { opacity: 1; } }

    /* 通用 panel */
    .c-panel {
      position: relative;
      background: rgba(14,14,14,0.65);
      border: 1px solid rgba(201,162,39,0.40);
      padding: 76px 36px 90px;
      overflow: hidden;
      opacity: 0; transform: translateY(20px);
      animation: panelIn 0.55s cubic-bezier(.2,.7,.2,1) both;
    }
    .c-panel .label {
      position: absolute; top: 26px; left: 30px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 18px; letter-spacing: 0.26em;
    }
    .c-panel .tag {
      position: absolute; top: 26px; right: 30px;
      font-family: 'Inter', system-ui, monospace;
      font-size: 13px; letter-spacing: 0.22em;
      color: rgba(255,255,255,0.35);
    }
    .c-panel .ctext {
      font-size: 30px; font-weight: 500;
      line-height: 1.55;
    }

    /* 左 panel = before（早期，单调暗淡） */
    .c-before {
      border-right: none;
      animation-delay: 0.4s;
      background:
        linear-gradient(135deg, rgba(120,80,200,0.05) 0%, rgba(8,8,8,0) 60%),
        rgba(14,14,14,0.7);
    }
    .c-before .label { color: rgba(255,255,255,0.45); }
    .c-before .ctext { color: rgba(255,255,255,0.68); }

    /* before 单调装饰：一条灰线 */
    .c-before .deco-line {
      position: absolute; left: 30px; right: 30px; bottom: 36px;
      height: 1px; background: rgba(255,255,255,0.15);
    }

    /* 右 panel = after（丰富明亮 + 多微动效） */
    .c-after {
      border-left: none;
      animation-delay: 0.6s;
      background:
        linear-gradient(135deg, rgba(201,162,39,0.08) 0%, rgba(8,8,8,0) 60%),
        rgba(14,14,14,0.72);
    }
    .c-after .label { color: rgba(232,196,107,0.85); }
    .c-after .ctext { color: rgba(255,255,255,0.95); }

    /* after 微动效组 1：进度条 */
    .c-after .ic-bar {
      position: absolute; left: 30px; right: 30px; bottom: 78px;
      height: 5px; background: rgba(255,255,255,0.08);
    }
    .c-after .ic-bar i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #c9a227, #e8c46b);
      animation: barFill 1.6s cubic-bezier(.2,.7,.2,1) 1.5s forwards;
    }
    @keyframes barFill { to { width: 88%; } }

    /* after 微动效组 2：柱状 */
    .c-after .ic-bars {
      position: absolute; left: 30px; right: 30px; bottom: 24px;
      height: 40px; display: flex; align-items: end; gap: 6px;
    }
    .c-after .ic-bars b {
      flex: 1; background: linear-gradient(180deg, #e8c46b, #c9a227);
      height: 0; animation: barRise 0.8s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .c-after .ic-bars b:nth-child(1){--h:30%;animation-delay:1.7s}
    .c-after .ic-bars b:nth-child(2){--h:48%;animation-delay:1.85s}
    .c-after .ic-bars b:nth-child(3){--h:65%;animation-delay:2.00s}
    .c-after .ic-bars b:nth-child(4){--h:82%;animation-delay:2.15s}
    .c-after .ic-bars b:nth-child(5){--h:100%;animation-delay:2.30s}
    @keyframes barRise { to { height: var(--h); } }

    /* after 脉冲点 */
    .c-after .ic-pulse {
      position: absolute; right: 36px; top: 28px;
      width: 14px; height: 14px;
    }
    .c-after .ic-pulse::before, .c-after .ic-pulse::after {
      content: ""; position: absolute; inset: 0;
      border-radius: 50%; background: #c9a227;
    }
    .c-after .ic-pulse::after { animation: pulseRing 1.8s ease-out infinite; }
    @keyframes pulseRing { 0%{transform:scale(1);opacity:0.8} 100%{transform:scale(3.4);opacity:0} }

    /* 底部脚标 panel */
    .footer-panel {
      position: absolute; left: 24px; right: 24px; bottom: 24px;
      height: 46px;
      border: 1px solid rgba(201,162,39,0.30);
      background: rgba(14,14,14,0.6);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px; color: rgba(232,196,107,0.7);
      letter-spacing: 0.22em;
      opacity: 0;
      animation: panelIn 0.45s ease 1.7s forwards;
    }

    .duration-debug {
      position: absolute; bottom: 14px; right: 22px; z-index: 99;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 10px; color: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
<div class="stage">

  <div class="topbar">
    <div><span class="dot"></span>COMPARE · BEFORE / AFTER · LIVE</div>
    <div>No.3 / 14</div>
  </div>

  <div class="grid">

    <!-- 顶部贯穿 title panel -->
    <div class="title-panel">
      <div class="label">// COMPARE</div>
      <div class="tag">CH.3</div>
      <div class="slide-title">他怎么把这件事放大</div>
    </div>

    <!-- 对照 wrapper -->
    <div class="compare-wrap">

      <!-- 左 panel = before -->
      <div class="c-panel c-before">
        <div class="label">// BEFORE</div>
        <div class="tag">早期</div>
        <div class="ctext">早期就抓住了'反直觉强结论当开场'这件事，靠暗调茶台 + 顶部红黄双行字打开人</div>
        <div class="deco-line" aria-hidden="true"></div>
      </div>

      <!-- 右 panel = after -->
      <div class="c-panel c-after">
        <div class="label">// AFTER</div>
        <div class="tag">现在</div>
        <div class="ic-pulse" aria-hidden="true"></div>
        <div class="ctext">现在七套场景，从白衣修行到 AI 操盘到政经叙事，都焊在同一行红黄双标题上</div>
        <div class="ic-bar" aria-hidden="true"><i></i></div>
        <div class="ic-bars" aria-hidden="true">
          <b></b><b></b><b></b><b></b><b></b>
        </div>
      </div>

    </div>

    <!-- 底部脚标 -->
    <div class="footer-panel">
      <div>微域生光 · 真实博主拆解</div>
      <div>COMPARE · compare</div>
    </div>

  </div>

  <div class="duration-debug">18400ms</div>
</div>
</body>
</html>
