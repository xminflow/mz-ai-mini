[project]
name = "studio-kit"
version = "0.1.0"
description = "自媒体素材产线。首版：把博主拆解报告转为 2 分钟口播短视频。"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "platformdirs>=4.2",
    "rich>=13.7",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12",
    "patchright>=1.40",
    "ffmpeg-python>=0.2",
    "python-pptx>=1.0.2",
]

[project.scripts]
studio-kit = "studio_kit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_kit"]

[tool.hatch.build.targets.wheel.shared-data]
".claude/skills" = "studio_kit/skills"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
